name: Sync verified publications

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out the website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Google Scholar and verify new records
        run: npm run sync:scholar

      - name: Validate the public website
        run: npm run check && npm run build && npm run audit && npm run test:sites

      - name: Commit verified publication updates
        id: changes
        run: |
          if git diff --quiet -- src/publication-updates.generated.json; then
            echo "No verified publication update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/publication-updates.generated.json
          git commit -m "chore: sync verified publications"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ needs.sync.outputs.changed == 'true' }}
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
