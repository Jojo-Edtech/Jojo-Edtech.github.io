name: Sync verified publications

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Google Scholar and verify new records
        run: npm run sync:scholar

      - name: Validate the public website
        run: npm run check && npm run build && npm run audit && npm run test:sites

      - name: Commit verified publication updates
        run: |
          if git diff --quiet -- src/publication-updates.generated.json; then
            echo "No verified publication update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/publication-updates.generated.json
          git commit -m "chore: sync verified publications"
          git push
